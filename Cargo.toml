[package]
name = "jpsan"
version = "0.1.0"
edition = "2021"
description = "浄化 (jpsan) — Lossless anime video sanitizer for Japanese immersion"
authors = ["Praveensenpai"]
license = "MIT"

[[bin]]
name = "jpsan"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
console = "0.15"
indicatif = "0.17"
walkdir = "2.5"
regex = "1.10"
tempfile = "3.10"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
